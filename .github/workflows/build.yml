name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev \
            libssl-dev patchelf

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Forzar descarga inicial y aceptación de licencias SDK
      run: |
        # Creamos la estructura inicial para que el sdkmanager pueda aceptar las licencias de forma no interactiva
        buildozer -v android debug || true
        ANDROID_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -d "$ANDROID_SDK_DIR" ]; then
          yes | "$ANDROID_SDK_DIR"/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Compilar APK con Buildozer (Definitivo)
      run: |
        buildozer -v android debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: radar-wifi-apk
        path: bin/*.apk
